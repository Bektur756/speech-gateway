services:
  vosk-ru:
    # Stopped 2026-09-08 — replaced by gigaam (below) as ROUTING's engine
    # for both languages; see app/session.py's ROUTING comment for why.
    # Kept, not deleted, for a fast rollback: `docker compose --profile
    # disabled up -d vosk-ru vosk-ky` brings these back, then point
    # gateway's VOSK_RU_URL/VOSK_KY_URL/ROUTING at them again.
    #
    # Custom server (./vosk-server) replacing alphacep/kaldi-ru:latest —
    # their reference asr_server.py has a long-standing bug where certain
    # audio chunks make vosk_recognizer_accept_waveform raise a TypeError
    # deep in ctypes/cffi handling, and their server doesn't guard against
    # it: the whole connection dies with a 1011 close, ending live
    # transcription for whatever call was using it. Confirmed hitting both
    # vosk-ru and vosk-ky repeatedly. Verified fixed by replaying the exact
    # recording from a call that crashed this way straight through the
    # point of the original crash with no interruption.
    #
    # Same underlying vosk/Kaldi engine and the same model (extracted from
    # the original alphacep/kaldi-ru image, confirmed version 0.42 — the
    # current recommended server-tier Russian model), so no accuracy
    # change — only the buggy connection-handling code was replaced.
    profiles: ["disabled"]
    build: ./vosk-server
    restart: unless-stopped
    environment:
      VOSK_MODEL_PATH: /opt/vosk-model/model
    volumes:
      - ./models/vosk-model-ru-0.42:/opt/vosk-model/model:ro

  vosk-ky:
    # Same custom server as vosk-ru above — same fix, same reasoning, same
    # stopped-but-not-deleted status.
    profiles: ["disabled"]
    build: ./vosk-server
    restart: unless-stopped
    environment:
      VOSK_MODEL_PATH: /opt/vosk-model/model
    volumes:
      - ./models/vosk-model-ky-0.42:/opt/vosk-model/model:ro

  gigaam:
    # GigaAM Multilingual (ai-sage/GigaAM-Multilingual, "ctc" revision —
    # the 220M compact encoder) — one model for both ky and ru, including
    # code-switched speech within a single utterance. See
    # gigaam-server/asr_server.py's docstring and app/session.py's ROUTING
    # comment for the full reasoning and the measured numbers (RTF~0.29 on
    # this CPU-only box, no GPU needed to start).
    build: ./gigaam-server
    restart: unless-stopped
    volumes:
      # ~800MB model download persisted here so it survives container
      # recreation instead of re-fetching from Hugging Face every time.
      - ./models/gigaam-cache:/root/.cache/huggingface

  gateway:
    build: .
    restart: unless-stopped
    depends_on:
      - gigaam
    environment:
      GIGAAM_URL: ws://gigaam:2700
      # Required unconditionally by app/main.py (os.environ["AIRUN_API_KEY"],
      # no default) — even though AiRUN isn't in ROUTING/PARALLEL_ENGINES
      # right now, main.py still imports it at module load, so a missing
      # key crash-loops the whole gateway, not just one engine. Pulled
      # from the .env file already sitting next to this compose file on
      # the server.
      AIRUN_API_KEY: ${AIRUN_API_KEY}
      AUDIOSOCKET_PORT_RU: "9098"
      AUDIOSOCKET_PORT_KY: "9099"
      # Whisper is disabled in app/main.py by _OFFLINE_WHISPER_PASSES = [].
      # Re-enable this together with the model volume mounts below if an
      # offline Whisper comparison pass is needed again.
      # WHISPER_MODEL_PATH: /models/kyrgyz-whisper-small
      # Measured on the real deployment: RTF=3.06 on the "small" model (24.4s
      # to transcribe an 8s window) — 3x slower than real-time on this
      # CPU-only box. Disabled until there's a GPU or a much faster backend.
      # Flip to "true" + docker compose up -d to re-enable, no rebuild needed.
      PARALLEL_STT_ENABLED: "false"
    ports:
      - "9098:9098"   # AudioSocket — ru queue, Asterisk dialplan points here
      - "9099:9099"   # AudioSocket — ky queue
      - "9100:9100"   # AudioSocket — ky dual-leg, client audio (ARI controller)
      - "9101:9101"   # AudioSocket — ky dual-leg, operator audio (ARI controller)
    volumes:
      - ./data/transcripts:/data/transcripts
      # Dual-leg call recordings are kept even while Whisper is disabled.
      - ./data/recordings:/data/recordings
      # Both sizes mounted so WHISPER_MODEL_PATH can be flipped to compare
      # small vs medium without rebuilding the image.
      # - ./models/kyrgyz-whisper-small:/models/kyrgyz-whisper-small:ro
      # - ./models/kyrgyz-whisper-medium:/models/kyrgyz-whisper-medium:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"       # WS API /calls/{id}/stream for external consumers
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
