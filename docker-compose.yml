services:
  vosk-ru:
    # Stopped 2026-09-08 — replaced by gigaam (below) as ROUTING's engine
    # for both languages; see app/session.py's ROUTING comment for why.
    # Kept, not deleted, for a fast rollback: `docker compose --profile
    # disabled up -d vosk-ru vosk-ky` brings these back, then point
    # gateway's VOSK_RU_URL/VOSK_KY_URL/ROUTING at them again.
    #
    # Custom server (./vosk-server) replacing alphacep/kaldi-ru:latest —
    # their reference asr_server.py has a long-standing bug where certain
    # audio chunks make vosk_recognizer_accept_waveform raise a TypeError
    # deep in ctypes/cffi handling, and their server doesn't guard against
    # it: the whole connection dies with a 1011 close, ending live
    # transcription for whatever call was using it. Confirmed hitting both
    # vosk-ru and vosk-ky repeatedly. Verified fixed by replaying the exact
    # recording from a call that crashed this way straight through the
    # point of the original crash with no interruption.
    #
    # Same underlying vosk/Kaldi engine and the same model (extracted from
    # the original alphacep/kaldi-ru image, confirmed version 0.42 — the
    # current recommended server-tier Russian model), so no accuracy
    # change — only the buggy connection-handling code was replaced.
    profiles: ["disabled"]
    build: ./vosk-server
    restart: unless-stopped
    environment:
      VOSK_MODEL_PATH: /opt/vosk-model/model
    volumes:
      - ./models/vosk-model-ru-0.42:/opt/vosk-model/model:ro

  vosk-ky:
    # Same custom server as vosk-ru above — same fix, same reasoning, same
    # stopped-but-not-deleted status.
    profiles: ["disabled"]
    build: ./vosk-server
    restart: unless-stopped
    environment:
      VOSK_MODEL_PATH: /opt/vosk-model/model
    volumes:
      - ./models/vosk-model-ky-0.42:/opt/vosk-model/model:ro

  gigaam:
    # GigaAM Multilingual (ai-sage/GigaAM-Multilingual, "ctc" revision —
    # the 220M compact encoder) — one model for both ky and ru, including
    # code-switched speech within a single utterance. See
    # gigaam-server/asr_server.py's docstring and app/session.py's ROUTING
    # comment for the full reasoning and the measured numbers (RTF~0.29 on
    # this CPU-only box, no GPU needed to start).
    build: ./gigaam-server
    restart: unless-stopped
    environment:
      # MVP default: endpoint speech after 700ms silence, capped at 5s.
      # Emergency rollback: set GIGAAM_SEGMENTATION_MODE=fixed and
      # GIGAAM_CHUNK_SECONDS=15 in the environment before `up -d gigaam`.
      GIGAAM_SEGMENTATION_MODE: ${GIGAAM_SEGMENTATION_MODE:-vad}
      GIGAAM_CHUNK_SECONDS: ${GIGAAM_CHUNK_SECONDS:-15}
      GIGAAM_VAD_SILENCE_MS: ${GIGAAM_VAD_SILENCE_MS:-500}
      GIGAAM_VAD_MIN_SEGMENT_SECONDS: ${GIGAAM_VAD_MIN_SEGMENT_SECONDS:-1.0}
      GIGAAM_VAD_MAX_SEGMENT_SECONDS: ${GIGAAM_VAD_MAX_SEGMENT_SECONDS:-5}
      # GIGAAM_VAD_RMS_THRESHOLD (default: 400)
      #
      # What it does:
      #   Per-audio-frame energy gate for the naive amplitude-based VAD in
      #   asr_server.py. For every incoming 16-bit PCM frame, its RMS
      #   (root-mean-square amplitude, range 0-32767 for 16-bit audio) is
      #   compared against this value: rms >= threshold => "voiced", otherwise
      #   "silence". This single boolean per frame drives everything else in
      #   VAD mode — speech_frame_count/silence_frame_count, when a segment is
      #   allowed to end early via "vad_silence" (accumulated silence_ms >=
      #   GIGAAM_VAD_SILENCE_MS after seeing speech), and whether a segment
      #   even starts accumulating toward GIGAAM_VAD_MIN_SEGMENT_SECONDS at all.
      #   It is purely amplitude-based — no spectral/ML voice detection — so it
      #   cannot distinguish speech from any other loud sound (line noise
      #   bursts, dial tones, static, background media).
      #
      # Too LOW (raise it if you see this):
      #   Background noise / line hum / crosstalk gets classified as "voiced",
      #   so vad_silence_ms never accumulates and segments almost never end via
      #   natural pause detection — they only ever hit
      #   GIGAAM_VAD_MAX_SEGMENT_SECONDS ("max_duration"). Symptom: check the
      #   "flush_reason" field on emitted final events — if it's overwhelmingly
      #   "max_duration" instead of "vad_silence" even during calls with clear
      #   pauses, the threshold is too low relative to the noise floor. Effect
      #   is functionally the same as running in fixed-chunk mode: segments get
      #   cut on a timer, not on sentence/phrase boundaries.
      #
      # Too HIGH (lower it if you see this):
      #   Quiet or distant-mic speech never crosses the threshold, so it's
      #   classified as silence: vad_seen_speech never flips true, speech
      #   frames aren't counted, and short quiet utterances can fail to reach
      #   GIGAAM_VAD_MIN_SEGMENT_SECONDS before the buffer is force-flushed by
      #   max_duration — i.e. speech gets dropped or truncated instead of
      #   properly segmented. Symptom: "speech_ratio" and "speech_frame_count"
      #   in emitted events stay near zero despite audible speech in the call,
      #   and VAD_SPEECH_STARTED never logs for that caller/leg.
      #
      # How to tune:
      #   Each final event already carries rms_min/rms_max/rms_mean/rms_p50/
      #   rms_p95 for its segment. Pull a few real recordings from this
      #   deployment, note the typical RMS during known-silence stretches vs.
      #   known-speech stretches (rms_p50 is a good single number to compare),
      #   and set the threshold roughly between the two populations. Telephony
      #   gain varies by carrier/trunk/codec, so this is not safely portable
      #   across deployments without a quick check — recalibrate per trunk if
      #   you add a new one with noticeably different line levels.
      GIGAAM_VAD_RMS_THRESHOLD: ${GIGAAM_VAD_RMS_THRESHOLD:-400}
    volumes:
      # ~800MB model download persisted here so it survives container
      # recreation instead of re-fetching from Hugging Face every time.
      - ./models/gigaam-cache:/root/.cache/huggingface

  gateway:
    build: .
    restart: unless-stopped
    depends_on:
      - gigaam
    env_file:
      - .env
    environment:
      GIGAAM_URL: ws://gigaam:2700
      # Required unconditionally by app/main.py (os.environ["AIRUN_API_KEY"],
      # no default) — even though AiRUN isn't in ROUTING/PARALLEL_ENGINES
      # right now, main.py still imports it at module load, so a missing
      # key crash-loops the whole gateway, not just one engine. Pulled
      # from the .env file already sitting next to this compose file on
      # the server.
      AIRUN_API_KEY: ${AIRUN_API_KEY}
      AUDIOSOCKET_PORT_RU: "9098"
      AUDIOSOCKET_PORT_KY: "9099"
      # Whisper is disabled in app/main.py by _OFFLINE_WHISPER_PASSES = [].
      # Re-enable this together with the model volume mounts below if an
      # offline Whisper comparison pass is needed again.
      # WHISPER_MODEL_PATH: /models/kyrgyz-whisper-small
      # Measured on the real deployment: RTF=3.06 on the "small" model (24.4s
      # to transcribe an 8s window) — 3x slower than real-time on this
      # CPU-only box. Disabled until there's a GPU or a much faster backend.
      # Flip to "true" + docker compose up -d to re-enable, no rebuild needed.
      PARALLEL_STT_ENABLED: "false"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY_PATH: keys/private_key.pem
      VAPID_SUBJECT: mailto:you@yourdomain.com
    ports:
      - "9098:9098"   # AudioSocket — ru queue, Asterisk dialplan points here
      - "9099:9099"   # AudioSocket — ky queue
      - "9100:9100"   # AudioSocket — ky dual-leg, client audio (ARI controller)
      - "9101:9101"   # AudioSocket — ky dual-leg, operator audio (ARI controller)
    volumes:
      - ./data/transcripts:/data/transcripts
      # Dual-leg call recordings are kept even while Whisper is disabled.
      - ./data/recordings:/data/recordings
      # Both sizes mounted so WHISPER_MODEL_PATH can be flipped to compare
      # small vs medium without rebuilding the image.
      # - ./models/kyrgyz-whisper-small:/models/kyrgyz-whisper-small:ro
      # - ./models/kyrgyz-whisper-medium:/models/kyrgyz-whisper-medium:ro
      - ./data/push_subscriptions.json:/data/push_subscriptions.json
      - ./keys:/srv/keys:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"       # WS API /calls/{id}/stream for external consumers
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # Optional live frontend development service (Vite HMR on port 5173).
  # Run with: docker compose --profile dev up frontend-dev
  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    profiles: ["dev"]
