services:
  vosk-ru:
    image: alphacep/kaldi-ru:latest
    restart: unless-stopped
    # built-in full-size Russian model, no volume needed
    #
    # Needs more RAM than this box currently has to run reliably. Its model
    # alone uses ~3GB; alongside vosk-ky + gateway on this 7.8GB host, it
    # crash-loops on load (confirmed: still crash-looped even after fixing
    # an unrelated gateway memory leak, so it's a standalone problem, not a
    # side effect of that leak). Deliberately left stopped for now
    # (`docker compose stop vosk-ru`) — kept in this file rather than
    # removed so it's easy to bring back once the box has more memory.
    # `gateway`'s depends_on will auto-restart it on every
    # `docker compose up gateway`; re-run `docker compose stop vosk-ru`
    # after any gateway redeploy until this is resolved for good.

  vosk-ky:
    # No dedicated alphacep/kaldi-ky image exists — reuse the kaldi-en
    # server binary and override its model path with the downloaded
    # Kyrgyz model (works "even for a different language" per alphacep docs).
    image: alphacep/kaldi-en:latest
    restart: unless-stopped
    volumes:
      - ./models/vosk-model-ky-0.42:/opt/vosk-model-en/model

  gateway:
    build: .
    restart: unless-stopped
    depends_on:
      # vosk-ru intentionally NOT listed here — see its own comment above.
      # Listing it would auto-restart it on every `docker compose up
      # gateway`, undoing the deliberate stop every time.
      - vosk-ky
    environment:
      AIRUN_API_KEY: ${AIRUN_API_KEY}
      VOSK_RU_URL: ws://vosk-ru:2700
      VOSK_KY_URL: ws://vosk-ky:2700
      AUDIOSOCKET_PORT_RU: "9098"
      AUDIOSOCKET_PORT_KY: "9099"
      WHISPER_MODEL_PATH: /models/kyrgyz-whisper-small
      # Measured on the real deployment: RTF=3.06 on the "small" model (24.4s
      # to transcribe an 8s window) — 3x slower than real-time on this
      # CPU-only box. Live parallel Whisper falls permanently behind and its
      # inference threads keep running (unkillable via asyncio.cancel) even
      # after the call ends, burning CPU that Vosk/AiRUN need. Disabled until
      # there's a GPU or a much faster backend. Flip to "true" + docker
      # compose up -d to re-enable, no rebuild needed.
      PARALLEL_STT_ENABLED: "false"
    ports:
      - "9098:9098"   # AudioSocket — ru queue, Asterisk dialplan points here
      - "9099:9099"   # AudioSocket — ky queue
      - "9100:9100"   # AudioSocket — ky dual-leg, client audio (ARI controller)
      - "9101:9101"   # AudioSocket — ky dual-leg, operator audio (ARI controller)
    volumes:
      - ./data/transcripts:/data/transcripts
      # Dual-leg call recordings, for the offline post-call Whisper pass.
      - ./data/recordings:/data/recordings
      # Both sizes mounted so WHISPER_MODEL_PATH can be flipped to compare
      # small vs medium without rebuilding the image.
      - ./models/kyrgyz-whisper-small:/models/kyrgyz-whisper-small:ro
      - ./models/kyrgyz-whisper-medium:/models/kyrgyz-whisper-medium:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"       # WS API /calls/{id}/stream for external consumers
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
