worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream speech_gateway {
        server gateway:8000;
    }

    server {
        listen 80;

        # WS API for downstream transcript consumers.
        # AudioSocket ports 9098/9099 are raw TCP and are NOT proxied here —
        # Asterisk connects to them directly.
        location /calls/ {
            proxy_pass http://speech_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location /health {
            proxy_pass http://speech_gateway;
            proxy_set_header Host $host;
        }
    }
}
