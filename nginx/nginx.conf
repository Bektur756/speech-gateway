worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream speech_gateway {
        server gateway:8000;
    }

    server {
        listen 80;

        # WS API for downstream transcript consumers.
        # AudioSocket ports 9098/9099 are raw TCP and are NOT proxied here —
        # Asterisk connects to them directly.
        location /calls/ {
            proxy_pass http://speech_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Live transcript dashboard (GET /live serves the page, /live/ws is
        # its WebSocket feed) — restored in app/main.py alongside the
        # FreeSWITCH audio endpoint, but never had a route here, so it was
        # only reachable from inside the docker network, never from a
        # browser.
        location /live {
            proxy_pass http://speech_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # FreeSWITCH's mod_audio_stream connects here (ws://<host>/freeswitch/audio,
        # port 80 implied) — see app/main.py's freeswitch_audio endpoint.
        # This route was missing from git entirely (same class of gap as
        # main.py's freeswitch code before it was recovered from a
        # containerd snapshot earlier today): nginx had apparently been
        # running for 5 days on an in-memory config that included it,
        # edited directly on the server and never committed, while the
        # on-disk file (and therefore every `git pull`) never had it.
        # Restarting nginx to add the /live route above reloaded the
        # on-disk config and silently broke this — every FreeSWITCH call
        # after that point had no transcription at all. Confirmed via
        # mod_audio_stream logging "connection error" immediately on
        # connect, and nginx itself returning a clean 404 for the path.
        location /freeswitch/ {
            proxy_pass http://speech_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location /health {
            proxy_pass http://speech_gateway;
            proxy_set_header Host $host;
        }

        location = /sw.js {
            proxy_pass http://speech_gateway;
            proxy_set_header Host $host;
        }

        location /push/ {
            proxy_pass http://speech_gateway;
            proxy_set_header Host $host;
        }

        location /controller/ {
            proxy_pass http://speech_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # Called by the ARI controller (on the Asterisk box) to link a
        # dual-leg call's client/operator call_ids into one merged
        # conversation transcript. Not reachable via any other path since
        # the gateway's own port 8000 isn't published to the host.
        location /conversations/ {
            proxy_pass http://speech_gateway;
            proxy_set_header Host $host;
        }
    }
}
